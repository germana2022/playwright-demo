<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCP + Playwright Demo</title>
    <style>
      body { font-family: Arial; padding: 24px; }
      .card { max-width: 480px; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
      button { padding: 10px 12px; margin-top: 8px; cursor: pointer; }
      #result { margin-top: 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">MCP Playwright Demo Page</h2>

      <label>Name</label><br/>
      <input id="nameInput" placeholder="Enter your name" /><br/>

      <button id="submitBtn">Submit</button>
      <div id="result"></div>
    </div>

    <script>
      document.getElementById("submitBtn").addEventListener("click", () => {
        const name = document.getElementById("nameInput").value.trim();
        const result = document.getElementById("result");
        if (!name) {
          result.style.color = "crimson";
          result.textContent = "Please enter your name";
        } else {
          result.style.color = "green";
          result.textContent = `Welcome ${name} 🚀`;
        }
      });
    </script>
  </body>
</html>
